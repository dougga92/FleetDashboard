<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Fotomentum Fleet</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark">📍</span>
      <span class="brand-name">Fotomentum <span class="brand-sub">Fleet</span> <span class="app-ver" id="app-ver" title="Fleet dashboard version"></span></span>
    </div>
    <div class="top-right">
      <span id="updated" class="updated">connecting…</span>
      <span id="live" class="live-dot" title="auto-refreshing"></span>
    </div>
  </header>

  <main class="wrap">
    <div class="daybar" id="daybar">
      <button type="button" id="day-prev" class="day-step" aria-label="Previous day">‹</button>
      <label class="day-pick"><span class="sort-label">Showing</span>
        <select id="day-select" aria-label="Day to show"><option value="">Today (live)</option></select>
      </label>
      <button type="button" id="day-next" class="day-step" aria-label="Next day">›</button>
      <button type="button" id="day-live" class="day-live" hidden>Back to live</button>
      <span class="sort-hint" id="day-hint"></span>
    </div>
    <section class="summary" id="summary" aria-label="Fleet summary"></section>
    <details class="compare" id="history">
      <summary>Night by night</summary>
      <div class="hist-controls" role="group" aria-label="Measure">
        <button type="button" data-hm="revenue">Revenue</button>
        <button type="button" data-hm="orders">Orders</button>
        <button type="button" data-hm="photos">Photos</button>
      </div>
      <div id="hist"></div>
    </details>
    <details class="compare" id="compare">
      <summary>Compare venues</summary>
      <div class="charts" id="charts"></div>
    </details>
    <div class="chart-tip" id="chart-tip" role="tooltip" hidden></div>
    <div class="sortbar" id="sortbar" role="group" aria-label="Sort venues">
      <span class="sort-label">Sort</span>
      <button type="button" data-sort="name">Name</button>
      <button type="button" data-sort="high">Highest $</button>
      <button type="button" data-sort="low">Lowest $</button>
      <button type="button" data-sort="custom">Drag to order</button>
      <button type="button" id="sound-btn" class="sound-btn" aria-pressed="false">🔕 Sound off</button>
      <span class="sort-hint" id="sort-hint" hidden>Drag a card by ⠿ · saved on this device only</span>
    </div>
    <section class="grid" id="grid" aria-label="Venues"></section>
    <p class="empty" id="empty" hidden>No venues have reported yet. Once a venue's <code>TELEMETRY_URL</code> points here, it appears within a minute.</p>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
